<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Emaar Group CRM - نظام CRM الخاص بشركة إعمار جروب</title>

    <!-- الهاتف: يسمح بـ«إضافة إلى الشاشة الرئيسية» ويفتح ملء الشاشة بلا شريط متصفح -->
    <meta name="theme-color" content="#030014" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="Emaar CRM" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />
    <link
      rel="stylesheet"
      href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css"
    />
    <link href="https://fonts.googleapis.com/css2?family=Tajawal:wght@300;400;500;700;900&display=swap" rel="stylesheet">
    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #080d18;
        font-family: 'Tajawal', sans-serif;
      }
      html[data-mode="light"],
      html[data-mode="light"] body {
        background: #eef2f7;
      }
    </style>
    <script>
      // نطبّق الوضع (ليلي/نهاري) قبل رسم أي شيء حتى لا تومض الألوان
      (function () {
        try {
          var saved = localStorage.getItem('crm_mode');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.mode = saved;
        } catch (e) {
          document.documentElement.dataset.mode = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
