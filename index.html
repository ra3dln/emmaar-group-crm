<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <!-- width=device-width: الصفحة بتتمدد على عرض الشاشة زي ما هي.
         interactive-widget=resizes-content: على أندرويد، الكيبورد بيقّص المساحة
         المرئية بدل ما يغطي الشاشة، فالحقل اللي بتكتب فيه يفضل باين.
         viewport-fit=cover: لأزرار الشاشة الآمنة (نوتش) على آيفون. -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover, interactive-widget=resizes-content"
    />
    <title>MSA CRM - نظام إدارة العملاء العقاري</title>

    <!-- الهاتف: يسمح بـ«إضافة إلى الشاشة الرئيسية» ويفتح ملء الشاشة بلا شريط متصفح -->
    <meta name="theme-color" content="#0e141a" media="(prefers-color-scheme: dark)" />
    <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSA CRM" />
    <meta name="format-detection" content="telephone=no" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192.png" />
    <link rel="apple-touch-icon" href="/icon-180.png" />

    <!-- الخطوط: «Changa» للعناوين والأرقام (هندسي عربي مميز)، و«IBM Plex Sans Arabic» لواجهة الجداول -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Changa:wght@400;500;600;700&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      html, body {
        margin: 0;
        padding: 0;
        width: 100%;
        height: 100%;
        background: #090d13;
        font-family: 'IBM Plex Sans Arabic', system-ui, sans-serif;
      }
      html[data-mode="light"],
      html[data-mode="light"] body {
        background: #eef0f2;
      }
    </style>
    <script>
      // نطبّق الوضع (ليلي/نهاري) قبل رسم أي شيء حتى لا تومض الألوان
      (function () {
        try {
          var saved = localStorage.getItem('crm_mode');
          if (saved !== 'light' && saved !== 'dark') {
            saved = window.matchMedia && window.matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
          }
          document.documentElement.dataset.mode = saved;
        } catch (e) {
          document.documentElement.dataset.mode = 'dark';
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
